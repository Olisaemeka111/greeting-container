# Lint, build, smoke-test and scan the image on every push and pull request.
# Pushing a version tag (e.g. `git tag v1 && git push origin v1`) also publishes
# a multi-arch image to ghcr.io/<owner>/sample-app:<tag>.
#
# Third-party actions are pinned to full commit SHAs.
name: container

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile

  build:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # only used by the publish steps on tag builds
    env:
      TEST_IMAGE: sample-app:test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set image name (GHCR requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sample-app" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Run the image the way Kubernetes would (non-root, read-only root filesystem,
      # no capabilities), check every endpoint and that PORT and GREETING are
      # honoured, then check that SIGTERM gives a clean exit.
      - name: Smoke test
        run: |
          fail() { echo "FAIL: $*" >&2; docker logs smoke >&2 || true; exit 1; }
          health() { docker inspect -f '{{.State.Health.Status}}' smoke; }

          docker run -d --name smoke \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --health-interval 2s \
            -e GREETING="hello from CI" -e PORT=9090 \
            -p 127.0.0.1:18080:9090 "$TEST_IMAGE"

          for _ in $(seq 1 30); do [ "$(health)" = healthy ] && break; sleep 1; done
          [ "$(health)" = healthy ] || fail "container never became healthy"

          url=http://127.0.0.1:18080
          [ "$(curl -fsS "$url/healthz" | jq -r .status)" = ok ] || fail "/healthz did not return ok"
          [ "$(curl -fsS "$url/" | jq -r .message)" = "hello from CI" ] || fail "/ ignored GREETING"
          [ "$(curl -fsS "$url/info" | jq -r .port)" = 9090 ] || fail "/info ignored PORT"
          [ "$(docker exec smoke id -u)" != 0 ] || fail "container is running as root"

          docker stop -t 10 smoke
          [ "$(docker inspect -f '{{.State.ExitCode}}' smoke)" = 0 ] || fail "unclean exit on SIGTERM"
          echo "PASS"

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.TEST_IMAGE }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags and labels
        id: meta
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha

      - name: Build and push multi-arch image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
